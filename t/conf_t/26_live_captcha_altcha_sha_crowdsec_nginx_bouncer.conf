# t/25 with the other derivation family. ALTCHA_ALGORITHM picks between two code
# paths in derive_key(), and t/25 only ever exercises the PBKDF2 one.
APPSEC_URL=
ENABLED=true
API_URL=http://127.0.0.1:8081
API_KEY=LFrdL+aiecMTSxpGE9vLkx5sGMwdIpgVovpVMfXp3J0
CACHE_EXPIRATION=1
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
REQUEST_TIMEOUT=3000
UPDATE_FREQUENCY=10
MODE=live
EXCLUDE_LOCATION=/v1/decisions
BAN_TEMPLATE_PATH=./ban
REDIRECT_LOCATION=
RET_CODE=
CAPTCHA_PROVIDER=altcha
SECRET_KEY=
SITE_KEY=
CAPTCHA_TEMPLATE_PATH=templates/captcha.html
CAPTCHA_EXPIRATION=3600
# The SHA family spends ALTCHA_COST as that many sequential digests rather than
# handing it to one native call, so it wants a far lower number than PBKDF2 does.
ALTCHA_COST=10
ALTCHA_COMPLEXITY=100
# SHA-512 rather than SHA-256 on purpose. Both take the same branch of derive_key(),
# but SHA-256's digest is already 32 bytes, which is exactly KEY_LENGTH - so the
# truncation inside the loop is the identity function and a test using it cannot tell
# whether the truncation happens per round or once at the end. SHA-512 digests 64
# bytes, so the cut is load-bearing every round and the test can actually see it.
ALTCHA_ALGORITHM=SHA-512
