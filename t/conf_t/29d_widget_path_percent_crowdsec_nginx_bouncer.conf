# 29 with a percent sign in ALTCHA_WIDGET_PATH. It reaches template.compile() in the
# replacement position of a gsub, where Lua reads % as a capture reference: unguarded
# this raises out of init_by_lua and nginx does not start at all.
APPSEC_URL=
ENABLED=true
API_URL=http://127.0.0.1:8081
API_KEY=LFrdL+aiecMTSxpGE9vLkx5sGMwdIpgVovpVMfXp3J0
CACHE_EXPIRATION=1
# bounce for all type of remediation that the bouncer can receive from the local API
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
REQUEST_TIMEOUT=3000
UPDATE_FREQUENCY=10
# live or stream
MODE=live
# The widget path is deliberately NOT excluded here: serving it happens before the
# remediation logic, so it needs no exemption. That is the property t/29 pins.
EXCLUDE_LOCATION=/v1/decisions
#those apply for "ban" action
BAN_TEMPLATE_PATH=
REDIRECT_LOCATION=
RET_CODE=
#those apply for "captcha" action
CAPTCHA_PROVIDER=altcha
SECRET_KEY=
SITE_KEY=
CAPTCHA_TEMPLATE_PATH=templates/captcha.html
CAPTCHA_INSECURE_TEMPLATE_PATH=templates/captcha_insecure.html
CAPTCHA_EXPIRATION=3600
# kept low so the test suite does not spend its time deriving keys
ALTCHA_COST=100
# self-hosted widget: the bundle on disk, and the path it is served at
ALTCHA_WIDGET_FILE=./t/assets_t/altcha-stub.js
ALTCHA_WIDGET_PATH=/.crowdsec/altcha%20test.js
