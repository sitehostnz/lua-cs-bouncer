APPSEC_URL=
ENABLED=true
API_URL=http://127.0.0.1:8081
API_KEY=LFrdL+aiecMTSxpGE9vLkx5sGMwdIpgVovpVMfXp3J0
CACHE_EXPIRATION=1
# bounce for all type of remediation that the bouncer can receive from the local API
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
REQUEST_TIMEOUT=3000
UPDATE_FREQUENCY=10
# live or stream
MODE=live
# exclude the bouncing on those location
# /_dict is a test-only white-box read of the altcha shared dict
EXCLUDE_LOCATION=/v1/decisions,/_dict,/_cache
#those apply for "ban" action
# /!\ REDIRECT_LOCATION and RET_CODE can't be used together. REDIRECT_LOCATION take priority over RET_CODE
BAN_TEMPLATE_PATH=./ban
REDIRECT_LOCATION=
RET_CODE=
#those apply for "captcha" action
#valid providers are recaptcha, hcaptcha, turnstile, altcha
CAPTCHA_PROVIDER=altcha
# altcha needs neither: it calls nobody, so it holds no account
SECRET_KEY=
SITE_KEY=
CAPTCHA_TEMPLATE_PATH=templates/captcha.html
CAPTCHA_EXPIRATION=3600
# The point of this test is a genuine round trip, so both knobs are set to the
# cheapest values that still exercise the real code path: 10 rounds per attempt, and
# a counter drawn from 50..100 (ALTCHA_COMPLEXITY is floored at 100). That is at most
# 100 PBKDF2 passes of 10 iterations for the solver in the test, which is instant.
ALTCHA_COST=10
ALTCHA_COMPLEXITY=100
ALTCHA_ALGORITHM=PBKDF2/SHA-256
