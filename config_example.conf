ENABLED=true
API_URL=${CROWDSEC_LAPI_URL}
# Authentication options, either using an API key or TLS client certificate.
API_KEY=${API_KEY}
USE_TLS_AUTH=false
TLS_CLIENT_CERT=/path/to/client.crt
TLS_CLIENT_KEY=/path/to/client.key
CACHE_EXPIRATION=1
# bounce for all type of remediation that the bouncer can receive from the local API
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
# Force every bounced decision to this remediation, whatever type the LAPI or the appsec
# component returned. Valid values are captcha and ban. Leave empty to honour the
# remediation as received. Forcing captcha with a misconfigured captcha provider still
# degrades to FALLBACK_REMEDIATION.
# Note that captcha decisions do not apply to /favicon.ico - the bouncer has always
# exempted it, because the captcha page's own favicon request would otherwise overwrite
# the address the visitor is sent back to once they solve. Exempted requests are passed
# through to the origin as normal, so setting this to captcha means an address the LAPI
# wanted banned still reaches that one path. Keep /favicon.ico static.
#
# Setting this to captcha weakens ban decisions, and how much depends entirely on
# CAPTCHA_PROVIDER. recaptcha, hcaptcha and turnstile at least attempt to tell a human
# from a script. altcha does not: it is a proof of work and nothing else, so what a
# banned IP has to spend to get through is CPU time, which is exactly what an attacker
# has. This repository's own t/25 solves one in about forty lines of Perl, with no
# browser involved. A solve then releases that IP for the whole of CAPTCHA_EXPIRATION
# (3600s below), renewable, so that value is the real blast radius. Forcing captcha
# over a ban list is a deliberate softening - reach for it to be kinder to false
# positives, not as a substitute for banning.
#
# It also overrides appsec "challenge" remediations, and those are not like the
# others: appsec returns a body, headers and cookies alongside a challenge, and the
# override discards them rather than carrying them forward. If you run appsec with a
# challenge configured, setting this replaces that flow entirely.
OVERRIDE_REMEDIATION=
REQUEST_TIMEOUT=3000
UPDATE_FREQUENCY=10
# By default internal requests are ignored, such as any path affected by rewrite rule.
# set ENABLE_INTERNAL=true to allow checking on these internal requests.
ENABLE_INTERNAL=false
# live or stream
MODE=live
# Only enforce decisions whose scenario contains one of these comma-separated substrings.
# Matching is done server-side by the LAPI (case-insensitive substring), e.g. "http-,wordpress".
# Leave empty to enforce decisions from all scenarios.
SCENARIOS_CONTAINING=
# Ignore decisions whose scenario contains one of these comma-separated substrings, e.g. "ssh-bf".
SCENARIOS_NOT_CONTAINING=
# exclude the bouncing on those location
EXCLUDE_LOCATION=
# The three template pages below (ban, captcha, captcha-insecure) can each be
# overridden per vhost from nginx config, following the $crowdsec_enable_bouncer
# pattern:
#   set $crowdsec_ban_template              <path>;
#   set $crowdsec_captcha_template          <path>;
#   set $crowdsec_captcha_insecure_template <path>;
# An unset or empty variable, or a path whose file does not exist, falls back to
# the global template configured here. Files are read per serve, so page edits
# apply without a reload. See "Per-vhost template overrides" in the README.
#those apply for "ban" action
# /!\ REDIRECT_LOCATION and RET_CODE can't be used together. REDIRECT_LOCATION take priority over RET_CODE
BAN_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/ban.html
REDIRECT_LOCATION=
RET_CODE=
#those apply for "captcha" action
#valid providers are recaptcha, hcaptcha, turnstile, altcha
CAPTCHA_PROVIDER=
# Captcha Secret Key. Unused by altcha, which calls nobody and so holds no account.
SECRET_KEY=
# Captcha Site key. Unused by altcha.
SITE_KEY=
CAPTCHA_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/captcha.html
# Optional page served in place of the captcha when the request arrives over plain
# HTTP, where the widget cannot run (see the HTTPS note under altcha below). Plain
# HTML, no placeholders. The visitor is denied with the same status a ban would carry;
# the stock page tells them to retry over https://, where solving the captcha releases
# their address for plain HTTP too. Leave empty to serve the ban remediation
# (BAN_TEMPLATE_PATH / REDIRECT_LOCATION / RET_CODE) instead.
# Two things count as a secure context and are served the captcha as normal: a vhost
# where you have set $crowdsec_assume_secure 1, and a loopback origin arriving from a
# loopback address. X-Forwarded-Proto is deliberately NOT consulted - nginx cannot tell
# whether a trusted proxy wrote it or passed the visitor's own value through, so it is
# forgeable in the direction that matters. Set $crowdsec_assume_secure on any vhost
# whose TLS is terminated upstream, or every captcha decision there becomes a denial
# you cannot tell apart from a genuine plain-HTTP request.
CAPTCHA_INSECURE_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/captcha_insecure.html
CAPTCHA_EXPIRATION=3600
# altcha only (https://altcha.org) - a proof-of-work captcha the bouncer issues and
# verifies itself, with no third-party service and no extra daemon to run.
#
# Visitors have to reach the site over HTTPS. The widget derives keys with
# crypto.subtle, which browsers expose only in a secure context, so on a plain http://
# origin it refuses before doing any work - which is why plain-HTTP requests are
# diverted to CAPTCHA_INSECURE_TEMPLATE_PATH above rather than served a captcha they
# cannot solve. TLS terminated at an upstream proxy is fine - what matters is the
# scheme the browser sees, not the one nginx sees - but you have to say so with
# $crowdsec_assume_secure 1, because X-Forwarded-Proto is not trusted. A loopback
# origin reached from a loopback address is a secure context on its own, so local
# development over http works without the switch.
#
# Two more things have to be in place outside this file before altcha will start:
#   * the lua-resty-openssl and lua-resty-string rocks, which is where the key
#     derivation comes from. Without them altcha refuses to configure and the
#     bouncer degrades to FALLBACK_REMEDIATION; every other provider is unaffected.
#   * `lua_shared_dict crowdsec_altcha 10m;` in the nginx http block. Without it
#     altcha likewise refuses to configure and degrades to FALLBACK_REMEDIATION:
#     challenges are attacker-paced writes, and sharing crowdsec_cache would let
#     them evict the decision cache the bouncer exists to enforce.
#
# Work per attempt: PBKDF2 iterations, or digest rounds for the SHA family. Paid once
# by us when minting a challenge, and up to ALTCHA_COMPLEXITY times by the visitor, so
# raising it raises both sides in step. Raising it also lengthens the blocking pass
# nginx does per captcha page served, so move it in modest steps.
#
# Comment this out and the default is chosen from ALTCHA_ALGORITHM instead: 5000 for
# the PBKDF2 family, a few hundred for the SHA family, which spends the number as that
# many sequential digests rather than handing it to one native call. The 5000 below
# suits the default PBKDF2/SHA-256 - if you switch to a SHA algorithm, either drop this
# line or lower it, because 5000 there is slow enough to strand a visitor on a modest
# phone and you will be warned about it at startup.
ALTCHA_COST=5000
# Number of attempts the visitor has to make. Paid only by the visitor - we still
# do exactly one derivation whatever this is - so this is the difficulty dial that
# costs us nothing. The counter is drawn from the top half of this range, so a
# visitor makes on average about three quarters of this many attempts, and at most
# this many. Drawing it rather than fixing it is what stops a client deriving the
# key in one pass and skipping the work.
#
# The real ceiling on both knobs together is the widget's own 90 second solve
# timeout. The bouncer keeps the "this visitor owes us a captcha" state for five
# minutes from the moment the page is served - a solution arriving after that finds
# nothing to validate against and is answered with the captcha page again - but the
# widget starts solving as the page loads (auto="onload") and gives up long before
# that window closes, so 90 seconds on the slowest hardware you serve is the budget
# to fit inside. Raise either knob in steps and check there.
ALTCHA_COMPLEXITY=10000
# Which proof-of-work algorithm the challenge uses. One of SHA-256, SHA-384,
# SHA-512, PBKDF2/SHA-256, PBKDF2/SHA-384, PBKDF2/SHA-512 - the six the altcha
# widget registers. Argon2id and Scrypt are part of the protocol but are not in
# the widget bundle, so they are rejected here rather than accepted and left
# unsolvable in the browser.
# The PBKDF2 family does one expensive pass per attempt; the SHA family does
# `cost` cheap digest rounds, so it wants a far lower ALTCHA_COST. PBKDF2/SHA-256
# is the default: it is the only one measured on both sides, and SHA-NI
# accelerates it on any AMD since 2017 or Intel since Ice Lake.
ALTCHA_ALGORITHM=PBKDF2/SHA-256
# Cap on how fast new challenges are minted, in challenges per second per worker - so
# the process-wide cap is this times worker_processes, and the startup log prints the
# number it worked out. Commented out is the default: the bouncer times a real
# derivation at startup and gives minting 5% of each worker second instead, a rate that
# follows ALTCHA_COST and this host's speed without being told either.
#
# Set it to say something that measurement cannot work out for itself. The usual case
# is a CPU limit nginx cannot see: worker_processes auto counts the host's cores, not a
# container's cgroup quota, so a 12-worker nginx capped at one CPU sizes its budget for
# twelve and has one to spend it on. Stating the rate is how you correct that.
#
# Divide by the worker count nginx reports, not by your CPU limit. Those 12 workers on
# one CPU want about 333 mints a second between them - 5% of that CPU, at 0.15 ms a
# derivation - so the number here is 333/12, about 28. State 333 and the process gets
# twelve times what you meant. The startup log prints the cap it worked out, so check
# that against the figure you had in mind.
#
# Drawbacks: a fixed rate does not move when ALTCHA_COST does, so doubling the cost
# doubles the time each worker spends deriving with nothing here to show it. The
# startup log prints the share of a worker second the rate implies and warns past 25%;
# past 100% it warns harder, because a cap beyond what a worker can mint in a second
# bounds nothing at all.
#
# Either way, over the cap a visitor who is not already holding a challenge gets
# FALLBACK_REMEDIATION instead, and one who is holding a challenge is unaffected.
#ALTCHA_MINTS_PER_SECOND=28
# Self-host the widget bundle, removing the last third party in this provider. By
# default the captcha page loads altcha.js from jsdelivr, so a visitor whose network
# blocks or cannot reach that CDN is served a captcha with no widget on it and has no
# way through. Set both of these and the bouncer reads the bundle at startup and
# serves it itself:
#
#   ALTCHA_WIDGET_FILE=/var/lib/crowdsec/lua/assets/altcha-3.2.1.js
#   ALTCHA_WIDGET_PATH=/.crowdsec/altcha-3.2.1.js
#
# FILE is where the bundle is on disk; PATH is the URL it is served at and what the
# captcha page's script tag points to. Set one without the other and the pair is
# ignored with a line in the log - it would either advertise a URL nothing serves or
# serve a URL nothing asks for. An unreadable file is reported the same way and falls
# back to the CDN, because a visitor who can reach jsdelivr is better off than one
# looking at a captcha page with no widget.
#
# Serving happens in the access phase, before any remediation, which is deliberate on
# three counts: it covers every vhost without a location block per server; the script
# is fetched by an address that is being captcha'd, and every other request from such
# an address is answered with the captcha page, so it would arrive as HTML; and being
# served the captcha page rewrites the URI the visitor is released to, so a bounced
# subresource fetch would drop them on the .js file after solving. No EXCLUDE_LOCATION
# entry is needed for PATH, and adding one would be harmless but pointless.
#
# Put the version in PATH. The bundle is served immutable with a year of cache, so a
# new version wants a new URL rather than a revalidation of the old one. Verify the
# file where you fetch it - the checksum belongs in whatever builds your image, not
# in the browser: a page served from your own origin has no third party left to
# distrust, so the script tag carries no integrity attribute in this mode.
ALTCHA_WIDGET_FILE=
ALTCHA_WIDGET_PATH=

APPSEC_URL=
APPSEC_FAILURE_ACTION=passthrough
APPSEC_CONNECT_TIMEOUT=
APPSEC_SEND_TIMEOUT=
APPSEC_PROCESS_TIMEOUT=
ALWAYS_SEND_TO_APPSEC=false
# When true, drop requests whose body cannot be read (e.g. HTTP/2 or HTTP/3 requests without a content-length header) instead of forwarding them to AppSec without a body.
APPSEC_DROP_UNREADABLE_BODY=false
SSL_VERIFY=true
