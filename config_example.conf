ENABLED=true
API_URL=${CROWDSEC_LAPI_URL}
# Authentication options, either using an API key or TLS client certificate.
API_KEY=${API_KEY}
USE_TLS_AUTH=false
TLS_CLIENT_CERT=/path/to/client.crt
TLS_CLIENT_KEY=/path/to/client.key
CACHE_EXPIRATION=1
# bounce for all type of remediation that the bouncer can receive from the local API
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
# Force every bounced decision to this remediation, whatever type the LAPI or the appsec
# component returned. Valid values are captcha and ban. Leave empty to honour the
# remediation as received. Forcing captcha with a misconfigured captcha provider still
# degrades to FALLBACK_REMEDIATION.
# Note that captcha decisions do not apply to /favicon.ico - the bouncer has always
# exempted it, because the captcha page's own favicon request would otherwise overwrite
# the address the visitor is sent back to once they solve. Exempted requests are passed
# through to the origin as normal, so setting this to captcha means an address the LAPI
# wanted banned still reaches that one path. Keep /favicon.ico static.
#
# Setting this to captcha weakens ban decisions, and how much depends entirely on
# CAPTCHA_PROVIDER. recaptcha, hcaptcha and turnstile at least attempt to tell a human
# from a script. altcha does not: it is a proof of work and nothing else, so what a
# banned IP has to spend to get through is CPU time, which is exactly what an attacker
# has. This repository's own t/25 solves one in about forty lines of Perl, with no
# browser involved. A solve then releases that IP for the whole of CAPTCHA_EXPIRATION
# (3600s below), renewable, so that value is the real blast radius. Forcing captcha
# over a ban list is a deliberate softening - reach for it to be kinder to false
# positives, not as a substitute for banning.
#
# It also overrides appsec "challenge" remediations, and those are not like the
# others: appsec returns a body, headers and cookies alongside a challenge, and the
# override discards them rather than carrying them forward. If you run appsec with a
# challenge configured, setting this replaces that flow entirely.
OVERRIDE_REMEDIATION=
REQUEST_TIMEOUT=3000
UPDATE_FREQUENCY=10
# By default internal requests are ignored, such as any path affected by rewrite rule.
# set ENABLE_INTERNAL=true to allow checking on these internal requests.
ENABLE_INTERNAL=false
# live or stream
MODE=live
# Only enforce decisions whose scenario contains one of these comma-separated substrings.
# Matching is done server-side by the LAPI (case-insensitive substring), e.g. "http-,wordpress".
# Leave empty to enforce decisions from all scenarios.
SCENARIOS_CONTAINING=
# Ignore decisions whose scenario contains one of these comma-separated substrings, e.g. "ssh-bf".
SCENARIOS_NOT_CONTAINING=
# exclude the bouncing on those location
EXCLUDE_LOCATION=
#those apply for "ban" action
# /!\ REDIRECT_LOCATION and RET_CODE can't be used together. REDIRECT_LOCATION take priority over RET_CODE
BAN_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/ban.html
REDIRECT_LOCATION=
RET_CODE=
#those apply for "captcha" action
#valid providers are recaptcha, hcaptcha, turnstile, altcha
CAPTCHA_PROVIDER=
# Captcha Secret Key. Unused by altcha, which calls nobody and so holds no account.
SECRET_KEY=
# Captcha Site key. Unused by altcha.
SITE_KEY=
CAPTCHA_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/captcha.html
CAPTCHA_EXPIRATION=3600
# altcha only (https://altcha.org) - a proof-of-work captcha the bouncer issues and
# verifies itself, with no third-party service and no extra daemon to run.
#
# Visitors have to reach the site over HTTPS. The widget derives keys with
# crypto.subtle, which browsers expose only in a secure context, so on a plain http://
# origin it refuses before doing any work and the visitor is left with a captcha they
# cannot solve. TLS terminated at an upstream proxy is fine - what matters is the
# scheme the browser sees, not the one nginx sees - and localhost is itself a secure
# context, so local development over http works. CAPTCHA_PROVIDER applies to the whole
# nginx instance, so one HTTP vhost is enough to strand its visitors.
#
# Two more things have to be in place outside this file before altcha will start:
#   * the lua-resty-openssl and lua-resty-string rocks, which is where the key
#     derivation comes from. Without them altcha refuses to configure and the
#     bouncer degrades to FALLBACK_REMEDIATION; every other provider is unaffected.
#   * `lua_shared_dict crowdsec_altcha 10m;` in the nginx http block. Without it
#     outstanding challenges share crowdsec_cache with CrowdSec's own decisions and
#     compete with them for space. If it is missing, a line is logged at error level
#     on startup - advisory, but error is the level to filter on.
#
# Work per attempt: PBKDF2 iterations, or digest rounds for the SHA family. Paid once
# by us when minting a challenge, and up to ALTCHA_COMPLEXITY times by the visitor, so
# raising it raises both sides in step. Raising it also lengthens the blocking pass
# nginx does per captcha page served, so move it in modest steps.
#
# Comment this out and the default is chosen from ALTCHA_ALGORITHM instead: 5000 for
# the PBKDF2 family, a few hundred for the SHA family, which spends the number as that
# many sequential digests rather than handing it to one native call. The 5000 below
# suits the default PBKDF2/SHA-256 - if you switch to a SHA algorithm, either drop this
# line or lower it, because 5000 there is slow enough to strand a visitor on a modest
# phone and you will be warned about it at startup.
ALTCHA_COST=5000
# Number of attempts the visitor has to make. Paid only by the visitor - we still
# do exactly one derivation whatever this is - so this is the difficulty dial that
# costs us nothing. The counter is drawn from the top half of this range, so a
# visitor makes on average about three quarters of this many attempts, and at most
# this many. Drawing it rather than fixing it is what stops a client deriving the
# key in one pass and skipping the work.
#
# The real ceiling on both knobs together is 60 seconds, not the 90 the widget itself
# allows. The bouncer keeps the "this visitor owes us a captcha" state for 60s from the
# moment the page is served; a solution arriving after that finds nothing to validate
# against and is answered with the captcha page again, so a visitor whose device is
# slow enough loops silently instead of failing. The widget waits to be clicked, and
# that clock is already running - so budget for the click, not just the solving. Raise
# either knob in steps and check on the slowest hardware you serve.
ALTCHA_COMPLEXITY=10000
# Which proof-of-work algorithm the challenge uses. One of SHA-256, SHA-384,
# SHA-512, PBKDF2/SHA-256, PBKDF2/SHA-384, PBKDF2/SHA-512 - the six the altcha
# widget registers. Argon2id and Scrypt are part of the protocol but are not in
# the widget bundle, so they are rejected here rather than accepted and left
# unsolvable in the browser.
# The PBKDF2 family does one expensive pass per attempt; the SHA family does
# `cost` cheap digest rounds, so it wants a far lower ALTCHA_COST. PBKDF2/SHA-256
# is the default: it is the only one measured on both sides, and SHA-NI
# accelerates it on any AMD since 2017 or Intel since Ice Lake.
ALTCHA_ALGORITHM=PBKDF2/SHA-256

APPSEC_URL=
APPSEC_FAILURE_ACTION=passthrough
APPSEC_CONNECT_TIMEOUT=
APPSEC_SEND_TIMEOUT=
APPSEC_PROCESS_TIMEOUT=
ALWAYS_SEND_TO_APPSEC=false
# When true, drop requests whose body cannot be read (e.g. HTTP/2 or HTTP/3 requests without a content-length header) instead of forwarding them to AppSec without a body.
APPSEC_DROP_UNREADABLE_BODY=false
SSL_VERIFY=true
